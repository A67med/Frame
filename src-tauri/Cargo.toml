[package]
name = "frame"
version = "0.5.0"
description = "A personal desktop media app for movies and TV"
edition = "2021"

[lib]
name = "frame_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
silero-vad = ["dep:ort", "dep:ndarray"]
asr-whisper = ["dep:whisper-rs"]
chromaprint = []

[dependencies]
anyhow = "1"
tauri = { version = "2.12.0", features = ["protocol-asset", "tray-icon", "image-png", "image-ico"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
walkdir = "2"
dunce = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
httpdate = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = [
  "stream",
  "multipart",
  "native-tls",
  "json",
  "gzip",
] }
flate2 = "1"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2", "aes-crypto"] }
regex = "1"
encoding_rs = "0.8"
quick-xml = { version = "0.41", features = ["serialize"] }
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
gilrs = { version = "0.11", default-features = false, features = ["xinput"] }
libc = "0.2"
socket2 = "0.5"
base64 = "0.22"
sha2 = "0.10"
png = "0.17"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
hound = "3.5"
discord-rich-presence = "1.1"
rust_cast = { path = "vendor/rust_cast", version = "0.20" }
mdns-sd = "0.13"
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
  "logging",
] }
frame-core = { path = "../crates/frame-core" }
frame-install-recovery = { path = "../crates/frame-install-recovery" }
librqbit = { version = "=8.1.1", default-features = false, features = ["rust-tls"] }
url = "2"
realfft = "3"
ort = { version = "=2.0.0-rc.10", optional = true }
ndarray = { version = "0.16", optional = true }
whisper-rs = { version = "0.14", optional = true }

libmpv2 = "4"
libmpv2-sys = "4"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2.14.1"
minisign-verify = "0.2"
tauri-plugin-process = "2"
tauri-plugin-window-state = "2"
notify-rust = "4"
futures = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Devices_Display",
  "Win32_System_Threading",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Media_Audio",
  "Win32_System_Registry",
  "Win32_Storage_FileSystem",
  "Win32_System_Power",
  "Win32_System_JobObjects",
  "Win32_System_ProcessStatus",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_SystemInformation",
  "Win32_System_LibraryLoader",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Graphics_Capture",
  "Graphics_DirectX_Direct3D11",
  "Graphics_Imaging",
  "Media",
  "Foundation",
  "Storage_Streams",
] }
window-vibrancy = "0.6"
wasapi = "0.15"
webview2-com = "0.39"

[profile.dev]
debug = "line-tables-only"
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
# Expose cached connected-seeder counts until librqbit provides them upstream.
librqbit = { path = "vendor/librqbit" }
