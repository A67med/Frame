name: App build

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - .github/ISSUE_TEMPLATE/**
      - docs/**
      - "**/*.md"

permissions:
  contents: read

env:
  # tsc -b in build:desktop runs out of the default ~2 GB heap; the Release workflow sets the same.
  NODE_OPTIONS: --max-old-space-size=6144

concurrency:
  group: app-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64
    timeout-minutes: 45
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/frame-core
            src-tauri

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare build assets
        run: pnpm run setup

      - name: Build Windows test installer
        run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Verify installer includes required runtime files
        run: node scripts/verify-windows-bundle.mjs --require-capstan

      - name: Upload Windows test installer
        uses: actions/upload-artifact@v7
        with:
          name: Frame-Windows-x64-Test-Installer
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/Frame_*-setup.exe
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
