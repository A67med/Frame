name: Release (Windows x64)

# Version changes are reviewed in a PR. A merge to main publishes only when the
# checked-in version does not already have a GitHub Release.
# The release pipeline never commits or pushes to the protected main branch.
# Documentation-only and GitHub-only maintenance do not publish installers.
# Only the signed Windows x64 NSIS installer is published after validation.
# macOS, Linux and Flatpak do not block the Windows release.
on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
      - ".dockerignore"
      - ".prettierignore"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  prepare:
    name: Validate approved release version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      sha: ${{ steps.check.outputs.sha }}
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify release version and check for existing publication
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          git checkout -B main origin/main
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          node scripts/check-release-version.mjs "$tag"

          # A regular app or documentation change with an already-published
          # version must not create a second release.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>&1; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Frame $tag is already published; release not needed."
            exit 0
          fi

          existing_tag="$(git rev-parse -q --verify "refs/tags/$tag^{commit}" || true)"
          if [ -n "$existing_tag" ] && [ "$existing_tag" != "$(git rev-parse HEAD)" ]; then
            echo "::error::$tag already points to $existing_tag, not current main. Do not rewrite a published tag."
            exit 1
          fi

          previous="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 || true)"
          if [ -n "$previous" ] && [ "$previous" != "$tag" ]; then
            node -e '
              const next = process.argv[1].split(".").map(Number);
              const last = process.argv[2].slice(1).split(".").map(Number);
              const order = next[0] - last[0] || next[1] - last[1] || next[2] - last[2];
              if (order <= 0) {
                console.error("::error::Release version must be newer than " + process.argv[2]);
                process.exit(1);
              }
            ' "$version" "$previous"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Building approved release $tag from main without committing or pushing."

  build:
    name: Windows x64 (NSIS)
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/frame-core
            src-tauri
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install JS deps
        run: pnpm install --frozen-lockfile
      - name: Verify HTTP redirect boundaries
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo test --manifest-path scripts/http-redirect-tests/Cargo.toml --locked --lib
      - name: Fetch Windows libmpv
        run: pnpm run setup:libmpv
      - name: Fetch Windows mpv
        run: pnpm run setup:mpv
      - name: Copy Visual C++ runtime
        run: pnpm run setup:vcruntime
      - name: Fetch and checksum-verify fonts
        run: pnpm run setup:fonts
      - name: Fetch external binaries
        run: pnpm run setup:binaries
      - name: Check and test media core
        working-directory: crates/frame-core
        run: |
          cargo check
          cargo test --all-targets
      - name: Verify updater signing key is configured
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is required for a signed Windows release."
            exit 1
          fi
      - name: Build signed Windows installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tauriScript: pnpm tauri
          args: --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.updater.conf.json
      - name: Verify installer includes required runtime files
        run: node scripts/verify-windows-bundle.mjs --require-capstan
      - name: Verify signed Windows release artifacts
        shell: pwsh
        run: |
          $dir = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          $installers = @(Get-ChildItem -Path $dir -Filter "Frame_*-setup.exe" -File)
          if ($installers.Count -ne 1) { throw "Expected exactly one Windows installer, got $($installers.Count)" }
          $installer = $installers[0]
          $signature = "$($installer.FullName).sig"
          if ($installer.Length -lt 1000000) { throw "Windows installer is suspiciously small" }
          if (-not (Test-Path $signature) -or (Get-Item $signature).Length -eq 0) {
            throw "Missing or empty updater signature: $signature"
          }
      - name: Upload signed Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: Frame-Windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/Frame_*-setup.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/Frame_*-setup.exe.sig
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publish Windows release
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.outputs.ready == 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - name: Download signed Windows installer
        uses: actions/download-artifact@v8
        with:
          name: Frame-Windows-x64
          path: artifacts/windows
      - name: Verify artifacts and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p upload sigs
          installer="Frame_${VERSION}_x64-setup.exe"
          test -s "artifacts/windows/$installer"
          test -s "artifacts/windows/$installer.sig"
          cp "artifacts/windows/$installer" upload/
          cp "artifacts/windows/$installer.sig" sigs/
          previous="$(git tag --list 'v*' --sort=-v:refname | grep -vx "v$VERSION" | head -n 1 || true)"
          if [ -f "docs/releases/v$VERSION.md" ]; then
            cp "docs/releases/v$VERSION.md" notes.md
          else
            node scripts/release-notes.mjs "${previous:-$(git rev-list --max-parents=0 HEAD | tail -n 1)}" "$SHA" > notes.md
          fi
          node scripts/updater-manifest.mjs "$VERSION" upload sigs notes.md
          {
            echo "## Downloads (Windows x64)"
            echo
            node scripts/release-assets.mjs "$VERSION" "$installer"
            echo
            echo "**Installer SHA-256:** $(sha256sum "upload/$installer" | cut -c1-64)"
            echo
            echo "## Changes"
            echo
            cat notes.md
            echo
            echo "Windows 10/11 x64 only. No macOS or Linux installers are published."
            echo "Older Frame builds with the previous updater signing key may need a one-time manual installation."
            if [ -n "$previous" ]; then
              echo
              echo "**Full changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$previous...v$VERSION"
            fi
          } > body.md
          gh release create "v$VERSION" upload/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "Frame $VERSION (Windows x64)" \
            --notes-file body.md \
            --latest
